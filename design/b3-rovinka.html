<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B3 · Rovinka</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b-base.css">
<style>
/* pohled ze startu po rovince: dráhy se sbíhají, číslo leží namalované na tartanu */
.track{position:relative;height:392px;background:linear-gradient(#7d2a1a 0,var(--tartan) 46%,var(--tartan-l) 100%);overflow:hidden}
.lanes{position:absolute;inset:0;width:100%;height:100%}
.floor{position:absolute;left:0;right:0;bottom:0;height:250px;perspective:260px;perspective-origin:50% -40%}
.floor .paint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-weight:900;font-size:230px;line-height:.75;color:var(--line);transform:rotateX(42deg);transform-origin:50% 100%;opacity:.96}
.meta{position:absolute;top:54px;left:20px;right:20px;display:flex;justify-content:space-between;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;z-index:2}
.state{position:absolute;top:80px;left:0;right:0;text-align:center;z-index:2}
.state b{font-weight:900;font-size:34px;text-transform:uppercase;line-height:1}
.state small{display:block;font-size:13px;font-weight:600;margin-top:4px;opacity:.9}
.blocks{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.blocks i{width:26px;height:8px;background:rgba(245,242,234,.25)}
.blocks i.on{background:var(--line)}

.list{margin-top:0}
.lane{position:relative;display:grid;grid-template-columns:44px 1fr auto;align-items:center;min-height:66px;padding-right:18px;border-bottom:1px solid #2c2a27}
.lane .n{font-weight:900;font-size:15px;text-align:center;color:var(--bg);background:var(--line);width:26px;height:26px;display:grid;place-items:center;justify-self:center}
.lane .t{font-weight:800;font-size:21px;text-transform:uppercase;line-height:1}
.lane .t small{display:block;font-weight:500;font-size:13px;color:var(--dim);text-transform:none;font-variation-settings:"wdth" 90;margin-top:4px}
.lane .v{font-weight:800;font-size:28px}
.lane .v i{font-style:normal;font-size:14px;color:var(--dim)}
.lane.done>:not(.stamp){opacity:.35}
.lane .stamp{right:66px;top:11px;font-size:17px;text-align:center}
.start{height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 12px,transparent 12px 24px)}
.bar{display:flex;justify-content:space-between;padding:12px 18px 0 44px;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:600}
.bar b{color:var(--ink);font-size:16px;letter-spacing:.02em}
.finish{position:absolute;left:16px;right:16px;bottom:98px;height:66px;background:var(--tartan);color:var(--ink);border:0;font-family:inherit;font-weight:900;font-size:24px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <div class="tag">B3 · ROVINKA</div>
  <section class="track">
    <svg class="grain" viewBox="0 0 390 392" preserveAspectRatio="none"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .1  0 0 0 0 .05  0 0 0 1.1 -.2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
    <svg class="lanes" viewBox="0 0 390 392" preserveAspectRatio="none" fill="none" stroke="#f5f2ea" stroke-width="2">
      <g opacity=".9">
        <path d="M195 150 L-260 392"/><path d="M195 150 L-110 392"/><path d="M195 150 L40 392"/>
        <path d="M195 150 L350 392"/><path d="M195 150 L500 392"/><path d="M195 150 L650 392"/>
      </g>
      <rect x="0" y="0" width="390" height="150" fill="#0d0d0c" stroke="none" opacity=".55"/>
    </svg>
    <div class="meta c70"><span>So 17.10. · T42</span><span>Den 290</span></div>
    <div class="state">
      <div class="blocks"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <b class="c62">Plný trénink</b>
      <small class="c70">HRV 71 ms −4 % · tep 48 · spánek 7:40</small>
    </div>
    <div class="floor"><div class="paint c62 tab">78</div></div>
  </section>
  <div class="start"></div>

  <div class="list">
    <div class="lane done"><span class="n c62">1</span><div class="t c70">Mobilita / rehab<small>kotník L · loket P</small></div><div class="v c62 tab">30<i>′</i></div><span class="stamp" style="--r:-6deg">Hotovo<small>06:41</small></span></div>
    <div class="lane"><span class="n c62">2</span><div class="t c70">Multi-event blok<small>dálka technika · koule · 3×150 m</small></div><div class="v c62 tab">120<i>′</i></div></div>
    <div class="lane"><span class="n c62">3</span><div class="t c70">Sauna + masáž<small>regenerace</small></div><div class="v c62 tab">45<i>′</i></div></div>
  </div>
  <div class="bar"><span>ACWR <b class="c62">1.12</b></span><span>sRPE 7d <b class="c62">2 840</b></span><span>Mono <b class="c62">1.4</b></span></div>

  <button class="finish c70" id="go">Hotovo</button>
  <nav class="tabs"><a class="on">DNES</a><a>TÝDEN</a><a>VÝKON</a><a>GRAFY</a><i class="g"></i></nav>
</div>
<script type="module">
import { wireStamp, el } from './b-stamp.js';
wireStamp({ button: document.getElementById('go'), rows: '.lane', make: t => el(`<span class="stamp">Hotovo<small>${t}</small></span>`) });
</script>
</body>
</html>
