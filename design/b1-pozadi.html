<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B1 · Pozadí</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b-base.css">
<style>
.track{position:relative;height:372px;background:var(--tartan);overflow:hidden}
.bgsvg{position:absolute;inset:0;width:100%;height:100%}
.meta{position:absolute;z-index:2;top:54px;left:20px;right:20px;display:flex;justify-content:space-between;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.paint{position:absolute;z-index:2;left:12px;bottom:36px;font-weight:900;font-size:200px;line-height:.78;letter-spacing:-.02em;color:var(--line)}
.paint-l{position:absolute;z-index:2;left:18px;bottom:14px;font-weight:800;font-size:13px;letter-spacing:.22em}
.state{position:absolute;z-index:2;right:18px;top:96px;text-align:right}
.state b{display:block;font-weight:900;font-size:30px;line-height:.9;text-transform:uppercase}
.state small{display:block;font-size:13px;font-weight:600;margin-top:5px;opacity:.9}
.dots{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--line)}

/* V1 ovál: vnitřek oválu je tmavý, 78 stojí v trávníku, dráhy obtáčí zleva dolů */
.v1 .track{background:var(--bg)}
.v1 .paint{left:auto;right:16px;bottom:auto;top:84px;font-size:170px}
.v1 .paint-l{left:auto;right:20px;bottom:auto;top:222px}
.v1 .state{top:auto;bottom:18px}
/* V6 sektor vrhu: 78 stojí uvnitř výseče vpravo dole */
.v6 .paint{left:auto;right:16px}
.v6 .paint-l{left:auto;right:20px}
.v6 .state{right:auto;left:20px;text-align:left;top:92px}
.v6 .dots{justify-content:flex-start}
/* V4 cílová rovinka zhora: čísla drah nahoře, stav dole */
.v4 .state{top:auto;bottom:18px}
.v4 .paint{bottom:40px}

.lane{display:grid;grid-template-columns:44px 1fr auto;align-items:center;min-height:66px;padding-right:18px;border-bottom:2px solid var(--line);position:relative}
.lane:first-child{border-top:2px solid var(--line)}
.lane .n{font-weight:900;font-size:32px;text-align:center;color:var(--tartan-l)}
.lane .t{font-weight:800;font-size:21px;text-transform:uppercase;line-height:1}
.lane .t small{display:block;font-weight:500;font-size:13px;color:var(--dim);text-transform:none;font-variation-settings:"wdth" 90;margin-top:4px}
.lane .v{font-weight:800;font-size:28px}
.lane .v i{font-style:normal;font-size:14px;color:var(--dim)}
.lane.done .t,.lane.done .v,.lane.done .n{opacity:.38}
.lane .stamp{right:70px;top:15px;font-size:19px}
.list{margin-top:16px}
.bar{display:flex;justify-content:space-between;padding:12px 18px 0 44px;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:600}
.bar b{color:var(--ink);font-size:16px;letter-spacing:.02em}
.finish{position:absolute;left:16px;right:16px;bottom:98px;height:66px;background:var(--tartan);color:var(--ink);border:0;font-family:inherit;font-weight:900;font-size:24px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.pick{position:absolute;z-index:6;top:30px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.pick a{font:700 11px "Archivo";color:rgba(255,255,255,.6);padding:2px 6px;border:1px solid rgba(255,255,255,.3);text-decoration:none}
.pick a.on{background:var(--line);color:var(--bg)}
</style>
</head>
<body>
<div class="phone" id="ph">
  <div class="tag" id="tag">B1</div>
  <nav class="pick" id="pick"></nav>
  <section class="track">
    <svg class="bgsvg" id="bg" viewBox="0 0 390 372" preserveAspectRatio="none"></svg>
    <svg class="grain" viewBox="0 0 390 372" preserveAspectRatio="none"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .1  0 0 0 0 .05  0 0 0 1.1 -.2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
    <div class="meta c70"><span>So 17.10. · T42</span><span>Den 290</span></div>
    <div class="state c62">
      <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <b>Plný trénink</b><small class="c70">HRV 71 ms −4 % · tep 48<br>spánek 7:40 · 3/4/4</small>
    </div>
    <div class="paint c62 tab">78</div>
    <div class="paint-l">READINESS</div>
  </section>

  <div class="list">
    <div class="lane done"><span class="n c62">1</span><div class="t c70">Mobilita / rehab<small>kotník L · loket P</small></div><div class="v c62 tab">30<i>′</i></div><span class="stamp" style="--r:-7deg">Hotovo</span></div>
    <div class="lane"><span class="n c62">2</span><div class="t c70">Multi-event blok<small>dálka technika · koule · 3×150 m</small></div><div class="v c62 tab">120<i>′</i></div></div>
    <div class="lane"><span class="n c62">3</span><div class="t c70">Sauna + masáž<small>regenerace</small></div><div class="v c62 tab">45<i>′</i></div></div>
  </div>
  <div class="bar"><span>ACWR <b class="c62">1.12</b></span><span>sRPE 7d <b class="c62">2 840</b></span><span>Mono <b class="c62">1.4</b></span></div>

  <button class="finish c70" id="go">Hotovo</button>
  <nav class="tabs"><a class="on">DNES</a><a>TÝDEN</a><a>VÝKON</a><a>GRAFY</a><i class="g"></i></nav>
</div>
<script type="module">
import { wireStamp, el } from './b-stamp.js';

const W = '#f5f2ea', T = '#b8402a', BG = '#0d0d0c';
const line = (d, w = 2.2, extra = '') => `<path d="${d}" fill="none" stroke="${W}" stroke-width="${w}" ${extra}/>`;

// Ovál stadionu: střed levé zatáčky (330,-50), dráhy po 24 px.
function stadium(r) { return `M${330} ${-50 - r} A${r} ${r} 0 0 0 ${330} ${-50 + r} L 900 ${-50 + r} L 900 ${-50 - r} Z`; }
const radii = [250, 274, 298, 322, 346, 370];

const variants = {
  1: { name: 'OVÁL', svg:
    `<path d="${stadium(370)}" fill="${T}"/><path d="${stadium(250)}" fill="${BG}"/>` +
    radii.map(r => line(stadium(r))).join('') },

  2: { name: 'SCHODOVITÝ START', svg:
    [168, 209, 250, 291, 332, 373].map(y => line(`M0 ${y} H390`)).join('') +
    // posunuté startovní čáry – každá dráha o kus dál
    [0, 1, 2, 3, 4].map(k => line(`M${206 + k * 36} ${168 + k * 41} v41`, 5)).join('') +
    [1, 2, 3, 4, 5].map((n, k) => `<text x="${224 + k * 36}" y="${198 + k * 41}" fill="${W}" font-family="Archivo" font-weight="900" font-size="24" style="font-variation-settings:'wdth' 62" text-anchor="middle">${n}</text>`).join('') },

  3: { name: 'DIAGONÁLA', svg:
    [-140, -80, -20, 40, 100, 160, 220].map(o => line(`M-40 ${300 + o} L430 ${40 + o}`)).join('') +
    line('M300 196 L404 384', 8) + line('M313 190 L417 378', 2.2, 'stroke-dasharray="6 6"') },

  4: { name: 'CÍL ZHORA', svg:
    [0, 65, 130, 195, 260, 325, 390].map(x => line(`M${x} 0 V372`)).join('') +
    line('M0 152 H390', 9) +
    [1, 2, 3, 4, 5, 6].map((n, k) => `<text x="${32 + k * 65}" y="140" fill="${W}" font-family="Archivo" font-weight="900" font-size="34" style="font-variation-settings:'wdth' 62" text-anchor="middle">${n}</text>`).join('') },

  5: { name: 'PŘEKÁŽKY', svg:
    [168, 209, 250, 291, 332, 373].map(y => line(`M0 ${y} H390`)).join('') +
    // překážky zhora: pruhovaná příčka + nohy dozadu
    [0, 1, 2, 3, 4].flatMap(k => [258, 344].map(x => {
      const y = 168 + k * 41;
      return line(`M${x} ${y + 5} v31`, 7) + line(`M${x} ${y + 5} v31`, 7, `stroke="${BG}" stroke-dasharray="5 5"`).replace(`stroke="${W}" `, '') +
        line(`M${x} ${y + 6} h-18 M${x} ${y + 35} h-18`, 2);
    })).join('') },

  6: { name: 'SEKTOR VRHU', svg: (() => {
    const cx = 34, cy = 360, a1 = -22.5 * Math.PI / 180, a2 = -57.4 * Math.PI / 180, L = 700;
    const ray = a => line(`M${cx + Math.cos(a) * 36} ${cy + Math.sin(a) * 36} L${cx + Math.cos(a) * L} ${cy + Math.sin(a) * L}`, 3);
    const arc = (r, m) => line(`M${cx + Math.cos(a1) * r} ${cy + Math.sin(a1) * r} A${r} ${r} 0 0 0 ${cx + Math.cos(a2) * r} ${cy + Math.sin(a2) * r}`, 1.6, 'stroke-dasharray="4 6"') +
      `<text x="${cx + Math.cos(a1) * r + 6}" y="${cy + Math.sin(a1) * r + 14}" fill="${W}" font-family="Archivo" font-weight="800" font-size="13" style="font-variation-settings:'wdth' 62">${m} m</text>`;
    return ray(a1) + ray(a2) + arc(150, 12) + arc(240, 14) + arc(330, 16) +
      `<circle cx="${cx}" cy="${cy}" r="34" fill="none" stroke="${W}" stroke-width="4"/>` +
      line(`M${cx + Math.cos(a1 - .2) * 34} ${cy + Math.sin(a1 - .2) * 34} A34 34 0 0 0 ${cx + Math.cos(a2 + .2) * 34} ${cy + Math.sin(a2 + .2) * 34}`, 10);
  })() },

  7: { name: 'ROZBĚH DÁLKY', svg:
    `<rect x="318" y="208" width="90" height="92" fill="#2a211a"/>` +
    line('M0 208 H390') + line('M0 300 H390') +
    `<rect x="292" y="208" width="18" height="92" fill="${W}"/><rect x="310" y="208" width="6" height="92" fill="#e8d9a8"/>` +
    [60, 120, 180, 240].map(x => line(`M${x} 292 v8`, 3)).join('') +
    // uhrabaný písek
    [222, 238, 254, 270, 286].map(y => `<path d="M322 ${y} H404" stroke="#4a3a2c" stroke-width="2"/>`).join('') +
    `<text x="301" y="200" fill="${W}" font-family="Archivo" font-weight="800" font-size="11" letter-spacing="1.5" text-anchor="middle" style="font-variation-settings:'wdth' 70">ODRAZ</text>` },

  8: { name: 'DESETIBOJ', svg:
    ['100 m', 'DÁLKA', 'KOULE', 'VÝŠKA', '400 m', '110 m PŘ.', 'DISK', 'TYČ', 'OŠTĚP', '1500 m'].map((d, k) => {
      const y = 190 + k * 18;
      return line(`M0 ${y} H390`, k === 5 ? 5 : 1.6) +
        `<text x="378" y="${y + 13}" fill="${W}" font-family="Archivo" font-weight="800" font-size="10" letter-spacing="1.5" text-anchor="end" style="font-variation-settings:'wdth' 70">${d}</text>`;
    }).join('') + line('M0 370 H390', 1.6) },
};

const v = new URLSearchParams(location.search).get('v') || '1';
document.getElementById('ph').classList.add('v' + v);
document.getElementById('bg').innerHTML = variants[v].svg;
document.getElementById('tag').textContent = `B1 · ${v} · ${variants[v].name}`;
document.getElementById('pick').innerHTML = Object.keys(variants).map(k => `<a href="?v=${k}" class="${k === v ? 'on' : ''}">${k}</a>`).join('');

wireStamp({ button: document.getElementById('go'), rows: '.lane', make: () => el('<span class="stamp">Hotovo</span>') });
</script>
</body>
</html>
