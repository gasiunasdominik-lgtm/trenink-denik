<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>B1 · Přehled pozadí</title>
<style>
body{margin:0;background:#1b1b1b;font:600 13px system-ui;color:#bbb}
.grid{display:grid;grid-template-columns:repeat(6,195px);gap:14px;padding:14px}
.cell{width:195px}
.cell span{display:block;margin-bottom:5px;letter-spacing:.08em}
.frame{width:195px;height:422px;overflow:hidden}
iframe{width:390px;height:844px;border:0;transform:scale(.5);transform-origin:0 0}
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
const names = ['Ovál', 'Schodovitý start', 'Diagonála', 'Cíl zhora', 'Překážky', 'Sektor vrhu', 'Rozběh dálky', 'Desetiboj', 'Výška', 'Jedna dráha', 'Štafeta', 'Oštěp'];
document.getElementById('g').innerHTML = names.map((n, i) =>
  `<div class="cell"><span>${i + 1} · ${n.toUpperCase()}</span><div class="frame"><iframe src="b1-pozadi.html?v=${i + 1}"></iframe></div></div>`).join('');
</script>
</body>
</html>
