<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B1 · Zatáčka</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b-base.css">
<style>
.track{position:relative;height:372px;background:var(--tartan);overflow:hidden}
.lanes{position:absolute;inset:0;width:100%;height:100%}
.meta{position:absolute;top:54px;left:20px;right:20px;display:flex;justify-content:space-between;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.paint{position:absolute;left:12px;bottom:36px;font-weight:900;font-size:200px;line-height:.78;letter-spacing:-.02em;color:var(--line)}
.paint-l{position:absolute;left:18px;bottom:14px;font-weight:800;font-size:13px;letter-spacing:.22em}
.state{position:absolute;right:18px;top:96px;text-align:right}
.state b{display:block;font-weight:900;font-size:30px;line-height:.9;text-transform:uppercase}
.state small{display:block;font-size:13px;font-weight:600;margin-top:5px;opacity:.9}
.dots{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--line)}

.lane{display:grid;grid-template-columns:44px 1fr auto;align-items:center;min-height:66px;padding-right:18px;border-bottom:2px solid var(--line);position:relative}
.lane:first-child{border-top:2px solid var(--line)}
.lane .n{font-weight:900;font-size:32px;text-align:center;color:var(--tartan-l)}
.lane .t{font-weight:800;font-size:21px;text-transform:uppercase;line-height:1}
.lane .t small{display:block;font-weight:500;font-size:13px;color:var(--dim);text-transform:none;font-variation-settings:"wdth" 90;margin-top:4px}
.lane .v{font-weight:800;font-size:28px}
.lane .v i{font-style:normal;font-size:14px;color:var(--dim)}
.lane.done .t,.lane.done .v,.lane.done .n{opacity:.38}
.lane .stamp{right:70px;top:15px;font-size:19px}
.list{margin-top:16px}
.bar{display:flex;justify-content:space-between;padding:12px 18px 0 44px;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:600}
.bar b{color:var(--ink);font-size:16px;letter-spacing:.02em}
.finish{position:absolute;left:16px;right:16px;bottom:98px;height:66px;background:var(--ink);color:var(--bg);border:0;font-family:inherit;font-weight:900;font-size:24px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <div class="tag">B1 · ZATÁČKA</div>
  <section class="track">
    <svg class="grain" viewBox="0 0 390 372" preserveAspectRatio="none"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .1  0 0 0 0 .05  0 0 0 1.1 -.2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
    <svg class="lanes" viewBox="0 0 390 372" preserveAspectRatio="none" fill="none" stroke="#f5f2ea" stroke-width="2.2">
      <path d="M-20 228 C 120 228, 260 250, 430 380"/>
      <path d="M-20 270 C 110 270, 230 290, 380 400"/>
      <path d="M-20 312 C 100 312, 200 330, 320 410"/>
    </svg>
    <div class="meta c70"><span>So 17.10. · T42</span><span>Den 290</span></div>
    <div class="state c62">
      <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <b>Plný trénink</b><small class="c70">HRV 71 ms −4 % · tep 48<br>spánek 7:40 · 3/4/4</small>
    </div>
    <div class="paint c62 tab">78</div>
    <div class="paint-l">READINESS</div>
  </section>

  <div class="list">
    <div class="lane done"><span class="n c62">1</span><div class="t c70">Mobilita / rehab<small>kotník L · loket P</small></div><div class="v c62 tab">30<i>′</i></div><span class="stamp" style="--r:-7deg">Hotovo</span></div>
    <div class="lane"><span class="n c62">2</span><div class="t c70">Multi-event blok<small>dálka technika · koule · 3×150 m</small></div><div class="v c62 tab">120<i>′</i></div></div>
    <div class="lane"><span class="n c62">3</span><div class="t c70">Sauna + masáž<small>regenerace</small></div><div class="v c62 tab">45<i>′</i></div></div>
  </div>
  <div class="bar"><span>ACWR <b class="c62">1.12</b></span><span>sRPE 7d <b class="c62">2 840</b></span><span>Mono <b class="c62">1.4</b></span></div>

  <button class="finish c70" id="go">Hotovo</button>
  <nav class="tabs"><a class="on">DNES</a><a>TÝDEN</a><a>VÝKON</a><a>GRAFY</a><i class="g"></i></nav>
</div>
<script type="module">
import { wireStamp, el } from './b-stamp.js';
wireStamp({ button: document.getElementById('go'), rows: '.lane', make: () => el('<span class="stamp">Hotovo</span>') });
</script>
</body>
</html>
