<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B · Dráha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0c; --ink:#f5f2ea; --dim:#8c877d; --rule:#262523;
  --tartan:#b8402a; --tartan-l:#cf5236; --line:#f5f2ea;
  --go:#49d17d; --warn:#f2b632;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1b1b1b;color:var(--ink);font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 88;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:grid;place-items:center}
.phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;border-radius:44px;box-shadow:0 0 0 10px #000,0 0 0 11px #333}
@media (max-width:430px){body{display:block}.phone{width:100%;height:100vh;border-radius:0;box-shadow:none}}
.cond{font-variation-settings:"wdth" 62;font-variant-numeric:tabular-nums}
.tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;letter-spacing:.2em;color:rgba(255,255,255,.55);z-index:3}

/* track surface */
.track{position:relative;height:388px;background:var(--tartan);overflow:hidden}
.track svg.grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;opacity:.55}
.track svg.lanes{position:absolute;inset:0;width:100%;height:100%}
.track .meta{position:absolute;top:56px;left:20px;right:20px;display:flex;justify-content:space-between;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.track .meta span:last-child{opacity:.75}
.paint{position:absolute;left:14px;bottom:62px;font-weight:900;font-size:196px;line-height:.78;letter-spacing:-.02em;color:var(--line);font-variation-settings:"wdth" 62;opacity:.95}
.paint-l{position:absolute;left:20px;bottom:30px;font-weight:800;font-size:15px;letter-spacing:.2em}
.state{position:absolute;right:20px;bottom:30px;text-align:right}
.state b{display:block;font-weight:900;font-size:30px;line-height:.9;font-variation-settings:"wdth" 62;text-transform:uppercase}
.state small{font-size:13px;opacity:.85}
.dots{position:absolute;right:20px;top:120px;display:flex;flex-direction:column;gap:7px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--line)}

/* lanes list */
.lane{display:grid;grid-template-columns:40px 1fr auto;align-items:center;min-height:62px;padding-right:18px;border-bottom:2px solid var(--line);position:relative}
.lane:first-of-type{border-top:2px solid var(--line)}
.lane .n{font-weight:900;font-size:30px;text-align:center;font-variation-settings:"wdth" 62;color:var(--tartan-l)}
.lane .t{font-weight:800;font-size:21px;text-transform:uppercase;font-variation-settings:"wdth" 70;line-height:1}
.lane .t small{display:block;font-weight:500;font-size:13px;color:var(--dim);text-transform:none;font-variation-settings:"wdth" 90;margin-top:3px}
.lane .v{font-weight:800;font-size:28px;font-variation-settings:"wdth" 62;font-variant-numeric:tabular-nums}
.lane .v i{font-style:normal;font-size:14px;color:var(--dim);font-weight:600}
.lane.done{opacity:.45}
.lane.done .t{text-decoration:line-through;text-decoration-thickness:2px}
.list{margin-top:14px}
.bar{display:flex;justify-content:space-between;padding:12px 18px 0 40px;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:600}
.bar b{color:var(--ink);font-size:16px;font-variation-settings:"wdth" 62;letter-spacing:.02em}

/* finish tape button */
.finish{position:absolute;left:16px;right:16px;bottom:98px;height:66px;background:var(--ink);color:var(--bg);border:0;font-family:inherit;font-weight:900;font-size:24px;letter-spacing:.12em;text-transform:uppercase;font-variation-settings:"wdth" 70;display:flex;align-items:center;justify-content:center;gap:14px;cursor:pointer;overflow:hidden}
.finish .tape{position:absolute;top:0;bottom:0;width:6px;left:50%;background:repeating-linear-gradient(var(--tartan) 0 8px,var(--ink) 8px 16px);transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .45s}
.finish.hit .tape{transform:translateX(200px) rotate(18deg);opacity:0}

.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;display:grid;grid-template-columns:repeat(4,1fr) 52px;border-top:1px solid var(--rule);background:var(--bg)}
.tabs a{font-weight:800;font-size:15px;letter-spacing:.1em;color:#5a5650;display:flex;justify-content:center;padding-top:15px;font-variation-settings:"wdth" 70}
.tabs a.on{color:var(--ink)}
.tabs a.on::after{content:"";position:absolute}
.tabs .g{justify-self:center;margin-top:14px;width:20px;height:20px;border-radius:50%;border:5px solid #5a5650}
</style>
</head>
<body>
<div class="phone">
  <div class="tag">SMĚR B · DRÁHA</div>
  <section class="track">
    <svg class="grain" viewBox="0 0 390 388" preserveAspectRatio="none"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .1  0 0 0 0 .05  0 0 0 1.1 -.2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
    <svg class="lanes" viewBox="0 0 390 388" preserveAspectRatio="none" fill="none" stroke="#f5f2ea" stroke-width="2.2">
      <path d="M-20 96 C 160 96, 300 130, 430 250"/>
      <path d="M-20 140 C 150 140, 280 170, 430 300"/>
      <path d="M-20 184 C 140 184, 260 212, 430 352"/>
      <path d="M-20 228 C 130 228, 240 256, 410 400"/>
      <path d="M-20 272 C 120 272, 220 300, 360 420" opacity=".0"/>
      <path d="M240 108 L262 92" stroke-width="3"/>
    </svg>
    <div class="meta"><span>So 17.10. · T42</span><span>Den 290</span></div>
    <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
    <div class="paint">78</div>
    <div class="paint-l">READINESS</div>
    <div class="state"><b>Plný trénink</b><small>HRV 71 ms −4 % · tep 48 · 7:40 h</small></div>
  </section>

  <div class="list">
    <div class="lane done"><span class="n">1</span><div class="t">Mobilita / rehab<small>kotník L · loket P</small></div><div class="v">30<i>′</i></div></div>
    <div class="lane"><span class="n">2</span><div class="t">Multi-event blok<small>dálka technika · koule · 3×150 m</small></div><div class="v">120<i>′</i></div></div>
    <div class="lane"><span class="n">3</span><div class="t">Sauna + masáž<small>regenerace</small></div><div class="v">45<i>′</i></div></div>
  </div>
  <div class="bar"><span>ACWR <b>1.12</b></span><span>sRPE 7d <b>2 840</b></span><span>Mono <b>1.4</b></span></div>

  <button class="finish" onclick="this.classList.toggle('hit');navigator.vibrate&&navigator.vibrate(12)"><span class="tape"></span>Hotovo</button>
  <nav class="tabs"><a class="on">DNES</a><a>TÝDEN</a><a>VÝKON</a><a>GRAFY</a><i class="g"></i></nav>
</div>
</body>
</html>
